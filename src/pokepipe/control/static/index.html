<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <title>Pokepipe control room</title>
  <!-- Display fonts; without a connection the page falls back to system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <span class="brand">pokepipe<b>.</b></span>
    <span id="watcher" class="pill">…</span>
  </header>

  <main>
    <h1>Your drops</h1>

    <a id="needs" class="needs" hidden>
      <span class="eyebrow">Needs you</span>
      <strong id="needs-title"></strong>
      <span id="needs-sub"></span>
    </a>

    <section id="pc" class="panel pc" hidden>
      <h2>On this PC</h2>
      <div id="pc-body"></div>
    </section>

    <section class="panel">
      <h2>Send a video</h2>
      <label class="field" for="set">Set
        <select id="set"></select>
      </label>
      <label class="pick" for="file">
        <input id="file" type="file" accept="video/*,.mov,.mp4,.m4v">
        <span class="pick-title">Drop a video</span>
        <span class="pick-sub">Choose from your phone</span>
      </label>
      <p class="pick-hint">Sends in pieces, so a locked screen or dropped Wi-Fi only pauses it</p>
      <div id="upload" class="upload" hidden>
        <div class="upload-head">
          <strong id="up-name"></strong>
          <span id="up-pct" class="num"></span>
        </div>
        <div class="bar"><div id="up-bar"></div></div>
        <div class="upload-foot">
          <span id="up-detail" class="muted num"></span>
          <button id="up-cancel" type="button" class="link">Cancel</button>
        </div>
        <p id="up-note" class="note" hidden></p>
      </div>
      <p id="inbox" class="muted small" hidden></p>
    </section>

    <section>
      <h2 class="list-title">Videos</h2>
      <div id="videos" class="videos"><p class="muted">Loading…</p></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
