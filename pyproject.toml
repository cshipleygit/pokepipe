[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokepipe"
version = "0.1.0"
description = "Local pipeline that turns Pokémon card-opening videos into edited TikTok shorts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chance Shipley" }]
requires-python = ">=3.12"
keywords = ["computer-vision", "clip", "video-editing", "llm", "tts", "ffmpeg", "pokemon-tcg"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# Ranges allow updates up to (not including) the next major version after the one
# tested, to avoid surprise breaking changes.
# torch/torchvision: install the CUDA build first from the PyTorch index (see README).
dependencies = [
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "open_clip_torch>=2.24,<5",
    "numpy>=1.26,<3",
    "pillow>=10,<14",
    "requests>=2.31,<3",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "typer>=0.12,<1",
    "rich>=13,<16",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "anthropic>=2.6,<3",
]

[project.urls]
Repository = "https://github.com/cshipleygit/pokepipe"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "responses>=0.25,<1", "ruff>=0.5,<1", "httpx>=0.27,<1"]

[project.scripts]
pokepipe = "pokepipe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pokepipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CUDA and downloads model weights"]
addopts = "-m 'not gpu'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer.Option(...) defaults are the idiomatic typer API
