[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokepipe"
version = "0.1.0"
description = "Local pipeline that turns Pokémon card-opening videos into edited TikTok shorts."
readme = "README.md"
requires-python = ">=3.12"
# torch/torchvision: install the CUDA build first from the PyTorch index (see README).
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "open_clip_torch>=2.24",
    "numpy>=1.26",
    "pillow>=10",
    "requests>=2.31",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
pokepipe = "pokepipe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pokepipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CUDA and downloads model weights"]
addopts = "-m 'not gpu'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer.Option(...) defaults are the idiomatic typer API
